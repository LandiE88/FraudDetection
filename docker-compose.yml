services:
  postgres:
    image: postgres:16-alpine
    container_name: frauddetection-postgres
    environment:
      POSTGRES_DB: frauddetection
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - frauddetection-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d frauddetection"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frauddetection-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Development here only to expose Swagger UI for easy manual exploration of this
      # sample; a real deployment would use Production and put secrets in a proper
      # secret store rather than inline in compose.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FraudDetectionDb: "Host=postgres;Port=5432;Database=frauddetection;Username=postgres;Password=postgres"
    ports:
      - "8080:8080"

volumes:
  frauddetection-pgdata:
